# Specialty groups the concept vocabulary is generated from (2026-10-11).
#
# The rule (Conditions & Search Refactor, "Specialty groups"): the main NUCC
# specialties plus subspecialties with ~300+ active doctors in our data. The same
# subspecialty under several NUCC classifications (Sports Medicine sits under five)
# is one group. Each group lists:
#
#   codes      NUCC taxonomy codes whose doctors make up the group. A concept
#              generated for the group is mapped to all of them in
#              condition_taxonomy; the specialty filter matches at the NUCC
#              classification level, so the subspecialty codes mostly add precision.
#   subfields  OpenAlex subfields that count as "a paper in this specialty", for
#              Tier 3 (loaded into specialty_field).
#   generate   false for groups that don't treat patients directly (pathology,
#              diagnostic radiology, public health). Their doctors still get Tier 1
#              and Tier 2 evidence for any concept; they just never define concepts
#              or pass a concept's specialty filter.
#
# Doctor counts are distinct active NPIs holding the code (pex, 2026-10-11).

