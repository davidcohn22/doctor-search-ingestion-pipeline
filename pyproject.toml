[project]
name = "pex-ingest"
version = "0.1.0"
description = "Physician Expertise Explorer — data ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "requests>=2.32",
    "lxml>=5.3",
    "rapidfuzz>=3.10",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
pex = "pex_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pex_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
